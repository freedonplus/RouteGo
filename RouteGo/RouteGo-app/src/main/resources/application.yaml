# =============================================================================
# RouteGo · 公共入口
#
# 本文件只做两件事：决定跑哪个 profile、监听哪个端口。
# 任何与环境相关的配置（数据源、Redis、密钥、CORS、日志、短信、OAuth…）都必须写到：
#
#   application-dev.yaml   本地开发：全部带默认值，克隆下来就能跑
#   application-prod.yaml  生产：全部走环境变量，关键项缺失直接启动失败
#
# 往这里加配置会让生产环境静默继承开发默认值，那是最难排查的一类事故。
# =============================================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: RouteGo
  profiles:
    # 默认 dev；生产用环境变量 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
