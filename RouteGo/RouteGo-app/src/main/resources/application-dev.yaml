spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:routego}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    hikari:
      pool-name: routego-dev-pool
      # 容器里的 MySQL 默认走 UTC，而 Java 侧写入的是东八区 LocalDateTime；
      # 不统一时区会出现「create_time 由数据库默认值写入 → 早 8 小时」这类脏数据
      connection-init-sql: SET time_zone = '+08:00'
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

# RocketMQ 已下线（消息域无调用方，routego.mq.enabled=false 且不配置 name-server）。
# 需要重新启用时：取消注释并设置 routego.mq.enabled=true
