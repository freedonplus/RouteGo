# =============================================================================
# RouteGo · 生产环境一键部署（docker compose）
#
#   cd RouteGo/docker
#   cp .env.example .env   # 首次：按注释填好域名与密钥（deploy.sh 会自动生成随机密钥）
#   ./deploy.sh up
#
# 拓扑：web(nginx:80) → app(8080) → mysql/redis/minio；各服务只在内部网络互通，
# MySQL / MinIO 控制台 / 后端端口默认只绑 127.0.0.1，不直接暴露到公网。
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-routego}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# ---------------------------------------------------------------------------
# app 的环境变量：.env 里是「人读的名字」，这里映射成 Spring 认的名字，
# 保证 .env 是唯一的事实来源，不用在两个文件里维护同一份密码。
# ---------------------------------------------------------------------------
x-app-env: &app-env
  TZ: ${TZ:-Asia/Shanghai}
  SPRING_PROFILES_ACTIVE: prod
  LOG_PATH: /app/logs
  JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=40 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8}

  # 数据库
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-routego}
  MYSQL_USERNAME: ${MYSQL_USER:-routego}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-10}
  DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}

  # Redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

  # 对象存储
  ROUTEGO_STORAGE_TYPE: ${ROUTEGO_STORAGE_TYPE:-minio}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET:-routego}

  # 应用密钥（缺失即启动失败）
  ROUTEGO_CRYPTO_AES_KEY: ${ROUTEGO_CRYPTO_AES_KEY}
  ROUTEGO_CRYPTO_HMAC_KEY: ${ROUTEGO_CRYPTO_HMAC_KEY}
  ROUTEGO_TEMP_URL_SECRET: ${ROUTEGO_TEMP_URL_SECRET}

  # 安全
  ROUTEGO_SECURITY_ALLOWED_ORIGINS: ${ROUTEGO_SECURITY_ALLOWED_ORIGINS}
  SA_TOKEN_COOKIE_SECURE: ${SA_TOKEN_COOKIE_SECURE:-true}

  # 短信 / IP 归属地 / OAuth
  ROUTEGO_SMS_ENABLED: ${ROUTEGO_SMS_ENABLED:-true}
  ROUTEGO_SMS_ID: ${ROUTEGO_SMS_ID:-}
  ROUTEGO_SMS_KEY: ${ROUTEGO_SMS_KEY:-}
  ROUTEGO_IP_LOCATION_ENABLED: ${ROUTEGO_IP_LOCATION_ENABLED:-true}
  ROUTEGO_OAUTH_BASE_URL: ${ROUTEGO_OAUTH_BASE_URL:-}
  ROUTEGO_OAUTH_SUCCESS_REDIRECT: ${ROUTEGO_OAUTH_SUCCESS_REDIRECT:-}
  ROUTEGO_OAUTH_FAILURE_REDIRECT: ${ROUTEGO_OAUTH_FAILURE_REDIRECT:-}

services:

  # -------------------------------------------------------------------------
  # MySQL 8.0：首次启动（数据卷为空）自动执行 sql/ 下的建表与权限初始化脚本
  # -------------------------------------------------------------------------
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    image: ${COMPOSE_PROJECT_NAME:-routego}-mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-routego}-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-routego}
      MYSQL_USER: ${MYSQL_USER:-routego}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-500}
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL:-512M}
      - --innodb-log-buffer-size=64M
      - --table-open-cache=512
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      # my.cnf 已 COPY 进镜像（见 Dockerfile.mysql），不做 bind mount：
      # 宿主机文件挂载后权限变 0777，MySQL 会忽略该配置且只在日志里留一行警告。
      # 只在数据卷为空的首次启动时执行；已有库请用 sql/upgrade-*.sql 手工升级
      - ../../sql/routego.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../sql/admin-init.sql:/docker-entrypoint-initdb.d/02-permission.sql:ro
      # 需要演示数据时放开下一行（仅首次初始化生效）
      # - ../../sql/demo-data.sql:/docker-entrypoint-initdb.d/03-demo.sql:ro
    ports:
      # 仅本机可连，方便运维用客户端排查；不需要就整段删掉
      - "127.0.0.1:${MYSQL_PUBLISH_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [routego]

  # -------------------------------------------------------------------------
  # Redis 7：登录态、验证码、限流、SSE 票据
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-routego}-redis
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [routego]
    # Redis 不对宿主机暴露；需要外部连临时放开 127.0.0.1:6379 即可

  # -------------------------------------------------------------------------
  # MinIO：图片/附件对象存储（应用首次上传时自动建桶）
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME:-routego}-minio
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      # 只有控制台绑本机；9000 走容器内网，公网访问一律经后端签名链接
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [routego]

  # -------------------------------------------------------------------------
  # 后端（Spring Boot 3 / JDK 17）
  # -------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-routego}/backend:${APP_IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-routego}-app
    restart: unless-stopped
    logging: *default-logging
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      # 前端与后端分离部署后，浏览器要能直达后端；这里默认监听所有网卡。
      # 只允许本机排查时把 APP_BIND_HOST 改成 127.0.0.1。
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-8080}:8080"
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
    stop_grace_period: 40s
    healthcheck:
      # prod profile 的 actuator 在 9090（无 /api 前缀）
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [routego]

  # -------------------------------------------------------------------------
  # 管理后台（Vue 构建产物 + nginx 反代 /api）
  # -------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: RouteGo/docker/Dockerfile.admin
    image: ${COMPOSE_PROJECT_NAME:-routego}/admin:${APP_IMAGE_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-routego}-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/routego.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [routego]

networks:
  routego:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
  app-logs:
  app-uploads:
