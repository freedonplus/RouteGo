# =============================================================================
# RouteGo 生产部署 · 管理后台站点（nginx）
# 挂载到容器 /etc/nginx/conf.d/default.conf
# =============================================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限对齐（20MB 文件 + 表单开销）
    client_max_body_size 25m;
    server_tokens off;

    # 容器内网来源才信任 X-Forwarded-For；前面再挂 SLB 时把网段补进来
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # 安全响应头（对所有响应生效）。若已上 HTTPS，再加 Strict-Transport-Security
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml;

    # 容器内 DNS（Docker 内置）。配合下面的变量写法，后端容器重建换 IP 后 nginx 能自动重新解析，
    # 否则会一直往旧 IP 转发，表现为发布后 502 直到手动 reload。
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $app_backend http://app:8080;

    # 容器健康检查（Dockerfile 的 HEALTHCHECK 依赖它）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # 客服实时推送（SSE）
    # 必须比 /api/ 的前缀更长才会优先命中；关掉缓冲，否则消息会「攒一批才到」，
    # 关闭超时，否则默认 60s 会周期性掐断长连接。
    # ---------------------------------------------------------------------
    location /api/operations/cs/stream {
        proxy_pass         $app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       1h;
        proxy_send_timeout       1h;
        chunked_transfer_encoding on;
        gzip                     off;
    }

    # ---------------------------------------------------------------------
    # 业务接口：保持 /api 前缀（后端 context-path 就是 /api）
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass         $app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        # 上传直接透传，不在 nginx 落临时文件
        proxy_request_buffering off;
    }

    # 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires    30d;
        access_log off;
        try_files  $uri =404;
    }

    # SPA 路由回退：/operations/cs-ticket 这类前端路由不能 404
    location / {
        # 入口 HTML 不缓存，发版刷新即生效
        expires    epoch;
        try_files  $uri $uri/ /index.html;
    }
}
