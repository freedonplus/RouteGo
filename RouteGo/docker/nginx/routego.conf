# =============================================================================
# RouteGo 管理后台静态站点（nginx）
# 挂载到容器 /etc/nginx/conf.d/default.conf
#
# 只负责托管构建产物，不做任何后端反向代理：
# 后端地址由 RouteGo-admin/.env.production 的 VITE_API_BASE_URL 在构建期写进
# 产物（src/utils/api-base.js 是唯一消费方）。换后端地址 → 改 .env.production
# → 重新构建 admin 镜像，与 Dockerfile.admin 的注释一致。
# =============================================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 前面挂 SLB / 外层 nginx 时保留，让访问日志记录真实客户端 IP
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # 安全响应头（跨域的 CORS 头由后端返回，这里不重复设置）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml application/xml+rss image/svg+xml;

    # 容器健康检查（Dockerfile.admin 的 HEALTHCHECK 依赖它）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires    30d;
        access_log off;
        try_files  $uri =404;
    }

    # SPA 路由回退：/operations/cs-ticket 这类前端路由不能 404
    location / {
        # 入口 HTML 不缓存，发版刷新即生效
        expires    epoch;
        try_files  $uri $uri/ /index.html;
    }
}
